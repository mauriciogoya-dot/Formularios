<!DOCTYPE html>
<html lang="es"> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="contenedor-principal">
        <section class="tarjeta-formulario">
            
            <header class="header-formulario">
                <h1>Formulario de inscripción</h1>
                <p>
                    Completa tus datos para inscribirte al curso de desarrollo web.
                    Los campos con * son obligatorios.
                </p>
            </header>
                <!-- <form> Es la etiqueta que define el inicio de un formulario web. Todo lo que esté adentro (campos, botones, opciones) formará parte de los datos que se enviarán.  -->
            <form action="#" method="POST" class="formulario-inscripcion"> 
                <!-- action="#": Especifica a dónde se envían los datos cuando el usuario hace clic en el botón de enviar. El # es un marcador de posición temporal (indica que los datos se envían a la misma página actual). En un proyecto real, acá iría la URL de un servidor (un archivo PHP, Python, NodeJS, etc.) que procese la información. -->
                <!-- method="POST": Define el método HTTP que se usa para enviar los datos. POST se utiliza para enviar información de forma segura dentro del cuerpo de la petición (oculta de la barra de direcciones del navegador), lo cual es ideal para formularios de inscripción, contraseñas o datos personales. -->
                 <!-- class="formulario-inscripcion": Es un identificador que usamos para vincular este formulario con el archivo .css y poder darle los estilos visuales (como el espaciado interno con gap). -->
                <fieldset>
                    <!-- <fieldset>: Se usa para agrupar lógicamente campos relacionados dentro de un formulario largo. Visualmente suele dibujar un recuadro suave alrededor de los campos que contiene. Ayuda muchísimo a la experiencia del usuario para que el formulario no se sienta una lista infinita de preguntas, separándolo por temas (como "Datos personales" por un lado y "Datos del curso" por el otro). -->
                    <legend>Datos personales</legend>
                    <!-- <legend>: Es el título de ese grupo. Debe ir inmediatamente después de abrir el <fieldset>. Además de ser la etiqueta visible del recuadro, es fundamental para la accesibilidad: los lectores de pantalla para personas con discapacidad visual leen el legend antes de cada campo para que el usuario sepa en qué contexto está respondiendo. -->
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre completo *</label>
                        <!-- <label for="nombre">: Representa la etiqueta o texto descriptivo del campo. El atributo for="nombre" es clave: se conecta directamente con el id="nombre" del <input>. Esto hace que si un usuario hace clic en la palabra "Nombre completo *", el cursor se posicione automáticamente adentro de la caja de texto, mejorando la usabilidad. -->
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required minlength="3" maxlength="60">
                        <!-- <input>: Es el elemento interactivo donde el usuario escribe. Dependiendo de su atributo type (como text, email o number), el navegador adaptará el teclado en celulares y aplicará validaciones automáticas. -->
                    </div>

                    <div class="grupo-formulario">
                        <!-- <div class="grupo-formulario">: Es un contenedor genérico que usamos como "caja". En nuestro CSS le aplicamos display: flex; flex-direction: column;, lo que obliga a que el <label> se coloque arriba y el <input> se acomode justo abajo de manera ordenada. -->
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" placeholder="Ej: 25" required min="16" max="99">
                    </div>

                    <div class="grupo-formulario">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="Ej: juan@ejemplo.com" required>
                        <small class="texto-ayuda">Usaremos este correo para contactarte.</small>
                    </div>

                    <div class="grupo-formulario">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 345 123 456" autoComplete="tel">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Información del curso</legend>

                    <div class="grupo-formulario">
                        <label for="curso">Curso de interés *</label>
                        <select id="curso" name="curso" required>
                            <option value="">Selecciona un curso</option>
                            <option value="desarrollo-web">HTML y CSS desde cero.</option>
                            <option value="data-science">JavaScript y DOM</option>
                            <option value="diseño-grafico">Proyecto Fronted Integrador</option>
                        </select>
                    </div>

                    <div class="grupo-formulario">
                        <span class="etiqueta-grupo">Turno preferido *</span>
                        <!-- <span>: Es una etiqueta contenedora de texto en línea (inline). A diferencia de un párrafo (<p>) o un título (<h1>), el <span> no tiene un significado semántico especial para el navegador ni aporta saltos de línea automáticos. 
                            ¿Para qué lo usamos en el formulario? Lo usamos en secciones como los campos de Radio (Turnos) o Checkboxes (Temas) para escribir el título del grupo (ej: *"Turno preferido "). Al usar un <span> en lugar de un <label>, evitamos confundir a los lectores de pantalla, ya que un <label> debe conectarse a un único input específico, mientras que el <span> acá simplemente actúa como un encabezado genérico para todo el grupo de opciones.-->
                        <div class="opciones-linea">
                            <div class="opcion">
                                <input type="radio" id="turno-manana" name="turno" value="mañana" required>
                                <label for="turno-manana">Mañana</label>
                            </div>
                            <div class="opcion">
                                <input type="radio" id="turno-tarde" name="turno" value="tarde" required>
                                <label for="turno-tarde">Tarde</label>
                            </div>
                            <div class="opcion">
                                <input type="radio" id="turno-noche" name="turno" value="noche" required>
                                <label for="turno-noche">Noche</label>
                            </div>
                        </div>
                    </div>

                    <div class="grupo-formulario">
                        <span class="etiqueta-grupo">Temas de interés *</span>
                        <div class="opciones-columna">
                            <div class="opcion">
                                <input type="checkbox" id="tema-html" name="temas[]" value="html">
                                <label for="tema-html">HTML</label>
                            </div>
                            <div class="opcion">
                                <input type="checkbox" id="tema-css" name="temas[]" value="css">
                                <label for="tema-css">CSS</label>
                            </div>
                            <div class="opcion">
                                <input type="checkbox" id="tema-js" name="temas[]" value="javascript">
                                <label for="tema-js">JavaScript</label>
                            </div>
                            <div class="opcion">
                                <input type="checkbox" id="tema-react" name="temas[]" value="react">
                                <label for="tema-react">React</label>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Comentarios adicionales</legend>
                    <div class="grupo-formulario">
                        <label for="comentarios">¿Tienes alguna pregunta o comentario?</label>
                        <textarea id="comentarios" name="comentarios" rows="5" maxlength="300" placeholder="Escribe aquí tus comentarios..."></textarea>
                    </div>
                </fieldset>

                <div class="grupo-formulario condiciones">
                    <div class="opcion">
                        <input type="checkbox" id="condiciones" name="condiciones" required>
                        <label for="condiciones">Acepto que mis datos sean utilizados para gestionar esta inscripción.</label>
                    </div>
                </div>

                <div class="acciones-formulario">   
                    <button type="reset" class="boton boton-secundario">Limpiar formulario</button>
                    <button type="submit" class="boton boton-primario">Enviar inscripción</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
