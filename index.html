<!DOCTYPE html>
<html lang="es"> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="contenedor-principal">
        <section class="tarjeta-formulario">
            
            <header class="header-formulario">
                <h1>Formulario de inscripción</h1>
                <p>
                    Completa tus datos para inscribirte al curso de desarrollo web.
                    Los campos con * son obligatorios.
                </p>
            </header>

            <form action="#" method="POST" class="formulario-inscripcion">
                
                <fieldset>
                    <legend>Datos personales</legend>
                    
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre completo *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required minlength="3" maxlength="60">
                    </div>

                    <div class="grupo-formulario">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" placeholder="Ej: 25" required min="16" max="99">
                    </div>

                    <div class="grupo-formulario">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="Ej: juan@ejemplo.com" required>
                        <small class="texto-ayuda">Usaremos este correo para contactarte.</small>
                    </div>

                    <div class="grupo-formulario">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 345 123 456" autoComplete="tel">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Información del curso</legend>

                    <div class="grupo-formulario">
                        <label for="curso">Curso de interés *</label>
                        <select id="curso" name="curso" required>
                            <option value="">Selecciona un curso</option>
                            <option value="desarrollo-web">HTML y CSS desde cero.</option>
                            <option value="data-science">JavaScript y DOM</option>
                            <option value="diseño-grafico">Proyecto Fronted Integrador</option>
                        </select>
                    </div>

                    <div class="grupo-formulario">
                        <span class="etiqueta-grupo">Turno preferido *</span>
                        <div class="opciones-linea">
                            <div class="opcion">
                                <input type="radio" id="turno-manana" name="turno" value="mañana" required>
                                <label for="turno-manana">Mañana</label>
                            </div>
                            <div class="opcion">
                                <input type="radio" id="turno-tarde" name="turno" value="tarde" required>
                                <label for="turno-tarde">Tarde</label>
                            </div>
                            <div class="opcion">
                                <input type="radio" id="turno-noche" name="turno" value="noche" required>
                                <label for="turno-noche">Noche</label>
                            </div>
                        </div>
                    </div>

                    <div class="grupo-formulario">
                        <span class="etiqueta-grupo">Temas de interés *</span>
                        <div class="opciones-columna">
                            <div class="opcion">
                                <input type="checkbox" id="tema-html" name="temas[]" value="html">
                                <label for="tema-html">HTML</label>
                            </div>
                            <div class="opcion">
                                <input type="checkbox" id="tema-css" name="temas[]" value="css">
                                <label for="tema-css">CSS</label>
                            </div>
                            <div class="opcion">
                                <input type="checkbox" id="tema-js" name="temas[]" value="javascript">
                                <label for="tema-js">JavaScript</label>
                            </div>
                            <div class="opcion">
                                <input type="checkbox" id="tema-react" name="temas[]" value="react">
                                <label for="tema-react">React</label>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Comentarios adicionales</legend>
                    <div class="grupo-formulario">
                        <label for="comentarios">¿Tienes alguna pregunta o comentario?</label>
                        <textarea id="comentarios" name="comentarios" rows="5" maxlength="300" placeholder="Escribe aquí tus comentarios..."></textarea>
                    </div>
                </fieldset>

                <div class="grupo-formulario condiciones">
                    <div class="opcion">
                        <input type="checkbox" id="condiciones" name="condiciones" required>
                        <label for="condiciones">Acepto que mis datos sean utilizados para gestionar esta inscripción.</label>
                    </div>
                </div>

                <div class="acciones-formulario">   
                    <button type="reset" class="boton boton-secundario">Limpiar formulario</button>
                    <button type="submit" class="boton boton-primario">Enviar inscripción</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
