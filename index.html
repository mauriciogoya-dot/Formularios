<!DOCTYPE html>
<html lang="es"> // pasamos el idioma a español

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="contenedor-principal">
        <section class="formulario-inscripcion">
            <header class="header-formulario">
                <h1>Formulario de inscripción</h1>
                <p>
                    Completa tus datos para inscribirte al curso de desarrollo web.
                    los campos con * son obligatorios.
                </p>

            </header>

            <form action="#" method="POST" class="formulario-inscripcion">
                <fieldset>
                    <legend>Datos personales</legend>
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre completo *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required minlength="3"
                            maxlength="60">
                    </div>

                    <div class="grupo-formulario">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" placeholder="Ej: 25" required min="16" max="99">
                    </div>

                    <div class="grupo-formulario">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="Ej: juan@ejemplo.com" required>
                    <small>Usaremos este correo para contactarte.</small>
                    </div>

                    <div class="grupo-formulario">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 345 123 456" autoComplete="tel">
                    </div>


                </fieldset>

                <fieldset>
                    <legend>Información del curso</legend>

                    <div class="grupo-formulario">
                        <label for="curso">Curso de interés *</label>
                        <select id="curso" name="curso" required>
                            <option value="">Selecciona un curso</option>
                            <option value="desarrollo-web">HTML y CSS desde cero.</option>
                            <option value="data-science">JavaScript y DOM</option>
                            <option value="diseño-grafico">Proyecto Fronted Integrador</option>
                        </select>
                    </div>

                    <div class="grupo-formulario">
                        <span  clas="etiqueta-grupo"> Turno preferido * </span>

                        <div class="opciones-linea">

                        </div>
                        

                    </div>


                </fieldset>

                <button type="submit">Enviar inscripción</button>

            </form>

        </section>
    </main>


</body>

</html>
